version: '3.8'

services:
  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Mount for development (hot reload)
      - ./public:/app/public
      # Avoid mounting node_modules
      - /app/node_modules
    environment:
      - NODE_ENV=production
    restart: unless-stopped 